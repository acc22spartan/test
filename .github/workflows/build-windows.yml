name: Build FoxyVPN for Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23.x"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm install

      - name: Test frontend
        run: npm run lint

      - name: Test Go packages
        run: go test ./...

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.9.2

      - name: Build Windows application
        run: wails build -platform windows/amd64 -clean

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: FoxyVPN-Windows-x64
          path: build/bin/*.exe
          if-no-files-found: error
          retention-days: 14
